name: Publish survey

# Builds the site (plus QR codes for the live address) and publishes it to the gh-pages branch.
# GitHub Pages serves that branch: Settings → Pages → Source: Deploy from a branch → gh-pages / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate QR codes for the live address
        run: node scripts/make-qr.mjs "${{ vars.SURVEY_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
      - name: Publish to gh-pages
        working-directory: site
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
